<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <title>Positioned Layout Exercise 1 Bubble Tea Shop</title>
</head>

<body>
  <!-- การ์ดหลัก -->
  <div class="card">
    <!-- รูปภาพหลัก -->
    <img src="./preview-img.jpeg" alt="Bubble Tea" class="card-image" />
    
    <!-- ป้ายบอกสถานที่ (มุมขวาบน) -->
    <div class="location-badge">ปากน้ำ</div>
    
    <!-- ชั้นเงาดำไล่ระดับ (Gradient Overlay) -->
    <div class="overlay"></div>
    
    <!-- ชื่อร้านด้านล่าง -->
    <div class="card-title">Kully-Qoo Bubble Tea ตลาดปากน้ำ</div>
  </div>
</body>

</html>
