<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <!-- Start coding here -->
   <!-- Header ด้านบนสุด -->
   <header class="chat-header">
    <h1>Techup Chatroom</h1>
</header>

<!-- พื้นที่แสดงกล่องแชททั้งหมด -->
  <main class="chat-container">

    <!-- บัญชาข้อความฝั่งผู้ส่ง: สีเขียว พร้อมหางแหลมชี้ขึ้น -->
    <div class="message sent green has-tail">
        สวัสดีจ้า
    </div>

    <!-- บัญชาข้อความฝั่งผู้ส่ง: สีเทา พร้อมปุ่มกากบาท (x) -->
    <div class="message sent gray with-close">
        Coding สนุกจังเลย
        <button class="close-btn">✕</button>
    </div>

    <div class="message sent green">
        😍 🤩
    </div>

    <!-- ข้อความฝั่งผู้รับ (ชิดซ้าย) -->
    <div class="message received">
        😍
    </div>

    <div class="message received">
        🥳
    </div>

</main>
</body>

</html>
